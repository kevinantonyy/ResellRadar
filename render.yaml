services:
  - type: web
    name: resellradar-bot
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: python discord_bot.py
    healthCheckPath: /
    envVars:
      - key: DISCORD_BOT_TOKEN
        sync: false
      - key: DISCORD_GUILD_ID
        sync: false
      - key: EBAY_CLIENT_ID
        sync: false
      - key: EBAY_CLIENT_SECRET
        sync: false
      - key: STOCKX_API_KEY
        sync: false
      - key: STOCKX_ACCESS_TOKEN
        sync: false
      - key: BESTBUY_API_KEY
        sync: false
